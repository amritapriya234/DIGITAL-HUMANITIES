<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medieval Manuscript Room - 3D Viewer</title>
  <!-- Load Google's open-source model-viewer component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    model-viewer {
      width: 100%;
      height: 600px;
      background-color: #1a1a1a;
    }
    .hotspot {
      background: #ffffff;
      border-radius: 32px;
      border: 2px solid #8b0000;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="models/manuscript_room.glb" 
    alt="3D Photogrammetry Model of a Medieval Manuscript Room" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
    
    <!-- Spatial Hotspot linked to Omeka S Manuscript Record -->
    <button class="hotspot" slot="hotspot-1" data-position="0.45m 1.2m -0.8m" data-normal="0m 1m 0m">
      📖 Codex Psalter (c. 1320)
    </button>
  </model-viewer>

</body>
</html>
